org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Slow/unstable network here regularly drops large downloads (e.g. Flutter engine
# debug jars) with socket/connection-reset errors well before the default 30s
# timeout would even be hit. Give artifact downloads more time and more retries
# per file, so a brief drop doesn't abort a mostly-finished download.
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.https.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000

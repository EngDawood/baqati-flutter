# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Split per-ABI APKs are much smaller downloads than the universal APK;
      # both are built so users who don't know their device's ABI still have
      # a single file that works everywhere.
      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Rename APKs for release
        run: |
          version="${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk "release-apks/baqati-${version}-universal.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-apks/baqati-${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-apks/baqati-${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-apks/baqati-${version}-x86_64.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: release-apks/*.apk
